<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Deepfake Detection</title>
<style>body{font-family:system-ui;background:#0c1428;color:#fff;max-width:940px;margin:32px auto;padding:16px}main{display:grid;grid-template-columns:2fr 1fr;gap:16px}.panel{padding:20px;border-radius:16px;background:#182844}video{width:100%;background:black;border-radius:12px;transform:scaleX(-1)}button{padding:12px 18px;margin:12px 6px 0 0;background:#64c8ff;border:0;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}p{color:#c3d0de}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head>
<body><h1>Real-Time Deepfake Detection</h1><p>Live webcam analysis using your trained CNN–LSTM model. Frames are sent to your local inference server, not saved.</p><main><section class="panel"><video id="video" autoplay muted playsinline></video><button id="start">Start webcam</button><button id="stop" disabled>Stop webcam</button><p id="status" role="status">Checking model...</p></section><section class="panel"><h2>Detection</h2><h3 id="label">Not started</h3><p id="score">Fake probability: —</p><p>Experimental estimate, not proof. Thresholds require calibration.</p><h3>Session history</h3><ol id="history"></ol></section></main><canvas id="canvas" width="320" height="240" hidden></canvas>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),label=document.getElementById('label'),score=document.getElementById('score'),history=document.getElementById('history');
let stream=null,timer=null,frames=[],busy=false;
async function check(){try{const r=await fetch('/api/live/status');const d=await r.json();status.textContent=d.message;start.disabled=!d.ready}catch(e){status.textContent=e.message;start.disabled=true}}
async function classify(){if(busy||frames.length!==8)return;busy=true;const batch=frames.splice(0,8);try{const r=await fetch('/api/live/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({frames:batch})});const d=await r.json();if(!r.ok)throw Error(d.error||'Prediction failed');label.textContent=d.label;score.textContent='Fake probability: '+(d.fake_probability*100).toFixed(1)+'%';const item=document.createElement('li');item.textContent=new Date().toLocaleTimeString()+' — '+d.label;history.prepend(item);if(history.children.length>10)history.lastChild.remove();status.textContent='Analyzing live frames'}catch(e){label.textContent='Unavailable';status.textContent=e.message}finally{busy=false}}
start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});video.srcObject=stream;await video.play();start.disabled=true;stop.disabled=false;label.textContent='Collecting frames';timer=setInterval(()=>{if(video.readyState<2||busy)return;canvas.getContext('2d').drawImage(video,0,0,320,240);frames.push(canvas.toDataURL('image/jpeg',0.7));if(frames.length===8)void classify()},300)}catch(e){status.textContent=e.message}};
stop.onclick=()=>{clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;frames=[];stop.disabled=true;check()};
window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});check();
</script></body></html>
