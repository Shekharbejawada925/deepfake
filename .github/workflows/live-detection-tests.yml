name: Live detection API tests
on:
  push:
    branches: [feature/live-webcam-detection]
  pull_request:
    paths:
      - 'live_detection/**'
      - '.github/workflows/live-detection-tests.yml'
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal API dependencies
        run: python -m pip install -r live_detection/requirements.txt
      - name: Run API tests
        working-directory: live_detection
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q live_detection
